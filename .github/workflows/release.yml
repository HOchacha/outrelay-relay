name: release

on:
  push:
    tags: ['v*']

defaults:
  run:
    # Every job checks this module out into a subdirectory so its
    # sibling modules can sit next to it (see checkout-siblings.sh).
    working-directory: outrelay-relay

env:
  # Bypass proxy.golang.org for boanlab/* modules; see ci.yml.
  GOPRIVATE: github.com/boanlab/*
  # Which checkout of the sibling modules to build against; a fork's
  # pull request is built against that fork's siblings.
  SIBLING_OWNER: ${{ github.event.pull_request.head.repo.owner.login || github.repository_owner }}
  SIBLING_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}

jobs:
  go-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: outrelay-relay
          persist-credentials: false
      - name: Check out sibling modules
        run: .github/scripts/checkout-siblings.sh OutRelay
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Check go-fmt
        run: make gofmt

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: outrelay-relay
          persist-credentials: false
      - name: Check out sibling modules
        run: .github/scripts/checkout-siblings.sh OutRelay
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Run golangci-lint
        run: make golangci-lint

  go-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: outrelay-relay
          persist-credentials: false
      - name: Check out sibling modules
        run: .github/scripts/checkout-siblings.sh OutRelay
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Run Gosec Security Scanner
        run: make gosec

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: outrelay-relay
          persist-credentials: false
      - name: Check out sibling modules
        run: .github/scripts/checkout-siblings.sh OutRelay
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Run unit tests
        run: make test

  push-image:
    needs: [go-fmt, go-lint, go-sec, go-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: outrelay-relay
          persist-credentials: false
      - name: Check out sibling modules
        run: .github/scripts/checkout-siblings.sh OutRelay
      - uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push outrelay-relay image
        run: make TAG=${{ github.ref_name }} push-image
